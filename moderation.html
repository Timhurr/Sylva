<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://zzlewwrakyowuilgqpoj.supabase.co; connect-src https://zzlewwrakyowuilgqpoj.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Bivaska · Modération</title>
<style>
@font-face{font-family:Fraunces;src:url(fonts/fraunces.woff) format("woff")}
@font-face{font-family:Inst;src:url(fonts/instrument-sans.woff) format("woff")}
:root{--bg:#0E1310;--surface:#171E19;--text:#EDE6D6;--muted:#9AA397;--line:rgba(255,236,205,.1);--accent:#F0A848;--danger:#E8705A;--ok:#7FB77E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inst,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 60px}
h1{font-family:Fraunces;font-weight:500;font-size:32px;margin:8px 0 4px}h2{font-family:Fraunces;font-weight:500;font-size:22px;margin:26px 0 8px}
.muted{color:var(--muted);font-size:13px}
input,button{font:inherit}input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;background:rgba(255,236,205,.08);color:var(--text)}
.ok{background:var(--ok);color:#0E1310}.ko{background:var(--danger);color:#0E1310}.pri{background:var(--accent);color:#1A1209}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.card b{display:block;font-size:16px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.card img{max-width:100%;border-radius:10px;margin-top:8px}
a{color:var(--accent)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tabs button.on{background:var(--accent);color:#1A1209}
</style></head><body>
<h1>Modération</h1>
<p class="muted">Réservé aux administrateurs de Bivaska. Les décisions sont immédiates.</p>
<div id="login"></div>
<div id="main" hidden>
  <div class="tabs" id="tabs"><button data-t="spots" class="on">Spots</button><button data-t="photos">Photos</button><button data-t="reports">Signalements</button><button data-t="ideas">Idées</button></div>
  <div id="list"></div>
</div>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="moderation.js"></script>
</body></html>
